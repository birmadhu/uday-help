<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uday</title>
</head>
<body style="margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f172a; color:#ffffff; font-family:-apple-system, sans-serif; text-align:center;">

  <div style="width:88px; height:88px; border-radius:50%; background:#2563eb; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:bold; margin-bottom:16px;">U</div>
  <h1 style="margin:0 0 8px 0;">Uday</h1>
  <p style="color:#94a3b8; margin:0 0 24px 0;">Tap the call icon in the bottom right to start</p>

  <div id="actionBox" style="display:none; margin-bottom:24px;">
    <a id="actionLink" href="#" target="_blank" rel="noopener noreferrer" style="background:#38bdf8; color:#082f49; padding:14px 28px; border-radius:999px; font-weight:bold; text-decoration:none; display:inline-block;">Open Link</a>
  </div>

  <elevenlabs-convai id="udayWidget" agent-id="agent_8101m728d0a3fsjbkpcx2mfy7j3d"></elevenlabs-convai>
  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

  <script>
    const widget = document.getElementById('udayWidget');
    const actionBox = document.getElementById('actionBox');
    const actionLink = document.getElementById('actionLink');

    function openInNewTab(url, label) {
      actionLink.href = url;
      actionLink.textContent = label;
      actionBox.style.display = 'block';
      const win = window.open(url, '_blank', 'noopener,noreferrer');
      if (win) win.focus();
    }

    widget.addEventListener('elevenlabs-convai:call', (event) => {
      event.detail.config.clientTools = {
        open_google_maps: ({ destination }) => {
          const q = encodeURIComponent(destination || '');
          openInNewTab('https://www.google.com/maps/search/?api=1&query=' + q, 'Open Google Maps: ' + destination);
          return 'Opened Google Maps';
        },
        call_phone: ({ phone_number }) => {
          const num = (phone_number || '').replace(/[^0-9+]/g, '');
          openInNewTab('tel:' + num, 'Call ' + num);
          return 'Calling ' + num;
        },
        open_whatsapp: ({ phone_number, message }) => {
          const num = (phone_number || '').replace(/[^0-9]/g, '');
          const text = encodeURIComponent(message || '');
          openInNewTab('whatsapp://send?phone=' + num + '&text=' + text, 'Open WhatsApp');
          return 'Opened WhatsApp';
        }
      };
    });
  </script>

</body>
</html>
